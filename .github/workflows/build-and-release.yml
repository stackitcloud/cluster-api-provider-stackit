name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      - name: Build release assets
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: |
          make clusterctl-release \
            IMG="${IMAGE}" \
            CLUSTERCTL_RELEASE_VERSION="${GITHUB_REF_NAME}"
          make build-installer IMG="${IMAGE}"

      - name: Generate checksums
        run: |
          release_dir="dist/clusterctl/infrastructure-stackit/${GITHUB_REF_NAME}"
          (
            cd "${release_dir}"
            find . -type f ! -name checksums.txt -print0 | sort -z | xargs -0 sha256sum
          ) > "${release_dir}/checksums.txt"
          sha256sum dist/install.yaml >> "${release_dir}/checksums.txt"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          release_dir="dist/clusterctl/infrastructure-stackit/${TAG}"
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            "${release_dir}"/* \
            "${release_dir}"/addons/* \
            dist/install.yaml
