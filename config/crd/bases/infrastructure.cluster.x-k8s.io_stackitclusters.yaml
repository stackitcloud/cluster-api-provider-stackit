---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: stackitclusters.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: StackitCluster
    listKind: StackitClusterList
    plural: stackitclusters
    shortNames:
    - stic
    singular: stackitcluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .spec.region
      name: Region
      type: string
    - jsonPath: .status.apiServerEndpoint.host
      name: Endpoint
      type: string
    - jsonPath: .status.bastion.publicIP
      name: Bastion IP
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .spec.network.id
      name: Network ID
      priority: 1
      type: string
    - jsonPath: .spec.projectID
      name: Project ID
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: StackitCluster is the Schema for the stackitclusters API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of StackitCluster
            properties:
              additionalLabels:
                additionalProperties:
                  type: string
                description: |-
                  additionalLabels is merged into the labels applied to cluster-wide
                  STACKIT resources such as the API server load balancer.
                maxProperties: 64
                type: object
              apiServerLoadBalancer:
                description: |-
                  apiServerLoadBalancer configures the load balancer in front of the
                  Kubernetes API server.
                properties:
                  enabled:
                    description: enabled toggles creation of an API server load balancer.
                    type: boolean
                type: object
              bastion:
                description: bastion configures an optional provider-managed SSH bastion
                  host.
                properties:
                  allowedCIDRs:
                    description: |-
                      allowedCIDRs are CIDR ranges allowed to connect to TCP/22 on the bastion.
                      Required when enabled is true.
                    items:
                      format: cidr
                      type: string
                    type: array
                  cloudInitRef:
                    description: |-
                      cloudInitRef references cloud-init user data passed to the bastion VM.
                      It can point to a ConfigMap for non-sensitive configuration or a Secret
                      when the cloud-init document contains sensitive values.
                    properties:
                      key:
                        description: key is the data key containing the cloud-init
                          document.
                        minLength: 1
                        type: string
                      kind:
                        description: kind is the Kubernetes object kind containing
                          the cloud-init document.
                        enum:
                        - ConfigMap
                        - Secret
                        type: string
                      name:
                        description: name is the ConfigMap or Secret name in the StackitCluster
                          namespace.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - kind
                    - name
                    type: object
                  enabled:
                    description: enabled toggles creation of a provider-managed SSH
                      bastion host.
                    type: boolean
                  imageID:
                    description: |-
                      imageID is the ID of the STACKIT image to boot the bastion from.
                      Required when enabled is true.
                    pattern: ^[0-9a-fA-F-]{36}$
                    type: string
                  machineType:
                    description: |-
                      machineType selects the STACKIT machine flavor for the bastion VM.
                      Required when enabled is true.
                    pattern: ^[a-z0-9][a-z0-9.-]*[a-z0-9]$
                    type: string
                  rootVolume:
                    description: rootVolume configures the bastion root disk.
                    properties:
                      deleteOnTermination:
                        description: |-
                          deleteOnTermination causes the root volume to be deleted when the VM is
                          deleted.
                        type: boolean
                      performanceClass:
                        description: performanceClass selects a STACKIT storage performance
                          class.
                        minLength: 1
                        type: string
                      sizeGiB:
                        description: sizeGiB is the size of the root volume in GiB.
                        minimum: 0
                        type: integer
                    type: object
                  sshKeyName:
                    description: |-
                      sshKeyName is the name of an existing SSH key in the STACKIT project.
                      Required when enabled is true.
                    maxLength: 127
                    pattern: ^[A-Za-z0-9_.@-]+$
                    type: string
                type: object
              controlPlaneEndpoint:
                description: |-
                  controlPlaneEndpoint allows the user to provide a pre-existing endpoint
                  when apiServerLoadBalancer.enabled is false.
                minProperties: 1
                properties:
                  host:
                    description: host is the hostname on which the API server is serving.
                    maxLength: 512
                    minLength: 1
                    type: string
                  port:
                    description: port is the port on which the API server is serving.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                type: object
              credentialsSecretRef:
                description: credentialsSecretRef references the Secret containing
                  STACKIT credentials.
                properties:
                  name:
                    description: name is unique within a namespace to reference a
                      secret resource.
                    type: string
                  namespace:
                    description: namespace defines the space within which the secret
                      name must be unique.
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              network:
                description: |-
                  network references the existing STACKIT network the cluster will use.
                  For MVP the network must already exist.
                properties:
                  id:
                    description: id is the STACKIT network ID.
                    minLength: 1
                    pattern: ^[0-9a-fA-F-]{36}$
                    type: string
                required:
                - id
                type: object
              projectID:
                description: projectID is the STACKIT project that owns the cluster
                  infrastructure.
                minLength: 1
                pattern: ^[0-9a-fA-F-]{36}$
                type: string
              region:
                description: region is the STACKIT region in which infrastructure
                  is created.
                minLength: 1
                pattern: ^[a-z]{2}[0-9]{2}$
                type: string
            required:
            - credentialsSecretRef
            - network
            - projectID
            - region
            type: object
            x-kubernetes-validations:
            - message: credentialsSecretRef.name is required
              rule: has(self.credentialsSecretRef.name) && size(self.credentialsSecretRef.name)
                > 0
            - message: controlPlaneEndpoint.host is required when apiServerLoadBalancer.enabled
                is false
              rule: 'has(self.apiServerLoadBalancer) && has(self.apiServerLoadBalancer.enabled)
                && self.apiServerLoadBalancer.enabled ? true : has(self.controlPlaneEndpoint)
                && has(self.controlPlaneEndpoint.host) && size(self.controlPlaneEndpoint.host)
                > 0'
            - message: bastion.imageID, bastion.machineType, bastion.sshKeyName, and
                bastion.allowedCIDRs are required when bastion.enabled is true
              rule: '!has(self.bastion) || !has(self.bastion.enabled) || !self.bastion.enabled
                || (has(self.bastion.imageID) && size(self.bastion.imageID) > 0 &&
                has(self.bastion.machineType) && size(self.bastion.machineType) >
                0 && has(self.bastion.sshKeyName) && size(self.bastion.sshKeyName)
                > 0 && has(self.bastion.allowedCIDRs) && size(self.bastion.allowedCIDRs)
                > 0)'
          status:
            description: status defines the observed state of StackitCluster
            properties:
              apiServerEndpoint:
                description: apiServerEndpoint is the endpoint the Kubernetes API
                  server is reachable at.
                minProperties: 1
                properties:
                  host:
                    description: host is the hostname on which the API server is serving.
                    maxLength: 512
                    minLength: 1
                    type: string
                  port:
                    description: port is the port on which the API server is serving.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                type: object
              apiServerLoadBalancerID:
                description: |-
                  apiServerLoadBalancerID stores the ID of a provider-managed API server
                  load balancer so it can be deleted on cluster teardown.
                type: string
              bastion:
                description: bastion stores observed provider-managed bastion resources.
                properties:
                  cloudInitHash:
                    description: |-
                      cloudInitHash records the resolved cloudInitRef content used to create
                      the current provider-managed bastion server.
                    type: string
                  publicIP:
                    description: publicIP is the routable IP address users connect
                      to.
                    type: string
                  publicIPID:
                    description: publicIPID is the provider-managed public IP resource
                      ID.
                    type: string
                  securityGroupID:
                    description: securityGroupID is the provider-managed bastion security
                      group ID.
                    type: string
                  serverID:
                    description: serverID is the provider-managed bastion server ID.
                    type: string
                type: object
              conditions:
                description: conditions represent the current state of the StackitCluster
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failureDomains:
                description: failureDomains is a list of availability zones available
                  to the cluster.
                items:
                  description: |-
                    FailureDomain is the Schema for Cluster API failure domains.
                    It allows controllers to understand how many failure domains a cluster can optionally span across.
                  properties:
                    attributes:
                      additionalProperties:
                        type: string
                      description: attributes is a free form map of attributes an
                        infrastructure provider might use or require.
                      type: object
                    controlPlane:
                      description: controlPlane determines if this failure domain
                        is suitable for use by control plane machines.
                      type: boolean
                    name:
                      description: name is the name of the failure domain.
                      maxLength: 256
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              initialization:
                description: initialization provides Cluster API v1beta2 contract
                  state.
                properties:
                  provisioned:
                    description: provisioned is true when the cluster infrastructure
                      is provisioned.
                    type: boolean
                type: object
              ready:
                description: ready indicates that the infrastructure required for
                  the cluster is ready.
                type: boolean
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
