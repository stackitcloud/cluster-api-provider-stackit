---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cluster.x-k8s.io
  resources:
  - clusters
  - machinepools
  - machines
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - infrastructure.cluster.x-k8s.io
  resources:
  - stackitclusters
  - stackitmachines
  - stackitmanagedclusters
  - stackitmanagednodepools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - infrastructure.cluster.x-k8s.io
  resources:
  - stackitclusters/finalizers
  - stackitmachines/finalizers
  - stackitmanagedclusters/finalizers
  verbs:
  - update
- apiGroups:
  - infrastructure.cluster.x-k8s.io
  resources:
  - stackitclusters/status
  - stackitmachines/status
  - stackitmanagedclusters/status
  - stackitmanagednodepools/status
  verbs:
  - get
  - patch
  - update
