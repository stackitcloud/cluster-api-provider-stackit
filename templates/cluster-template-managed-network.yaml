          criSocket: unix:///var/run/containerd/containerd.sock
          kubeletExtraArgs:
            - name: cloud-provider
              value: external
---
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: ${CLUSTER_NAME}-cloud-provider-stackit
  namespace: ${NAMESPACE}
spec:
  strategy: Reconcile
  clusterSelector:
    matchLabels:
      cluster-api-provider-stackit/cloud-provider-stackit: "true"
  resources:
    - kind: Secret
      name: ${CLUSTER_NAME}-cloud-provider-stackit
