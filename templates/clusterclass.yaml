apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: stackit
spec:
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      kind: StackitClusterTemplate
      name: stackit-cluster
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KubeadmControlPlaneTemplate
      name: stackit-control-plane
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: StackitMachineTemplate
        name: stackit-control-plane
    deletion:
      nodeDrainTimeoutSeconds: 900
    healthCheck:
      checks:
        nodeStartupTimeoutSeconds: 600
        unhealthyNodeConditions:
          - type: Ready
            status: "False"
            timeoutSeconds: 600
          - type: Ready
            status: "Unknown"
            timeoutSeconds: 600
  workers:
    machineDeployments:
      - class: default-worker
        bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            name: stackit-default-worker
        infrastructure:
          templateRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: StackitMachineTemplate
            name: stackit-default-worker
        deletion:
          nodeDrainTimeoutSeconds: 900
        healthCheck:
          checks:
            nodeStartupTimeoutSeconds: 600
            unhealthyNodeConditions:
              - type: Ready
                status: "False"
                timeoutSeconds: 600
              - type: Ready
                status: "Unknown"
                timeoutSeconds: 600
          remediation:
            maxInFlight: 2
            triggerIf:
              unhealthyLessThanOrEqualTo: 40%
  variables:
    - name: stackitProjectID
      required: true
      schema:
        openAPIV3Schema:
          type: string
          description: STACKIT project ID used for cluster infrastructure.
    - name: stackitRegion
      required: true
      schema:
        openAPIV3Schema:
          type: string
          description: STACKIT region used for cluster infrastructure.
    - name: stackitNetworkID
      required: true
      schema:
        openAPIV3Schema:
          type: string
          description: Existing STACKIT network ID used by cluster machines.
    - name: stackitImageID
      required: true
      schema:
        openAPIV3Schema:
          type: string
          description: STACKIT image ID used by cluster machines.
    - name: stackitMachineType
      required: true
      schema:
        openAPIV3Schema:
          type: string
          description: STACKIT machine type used by control plane and worker machines.
    - name: stackitCredentialsSecretName
      required: true
      schema:
        openAPIV3Schema:
          type: string
          description: Kubernetes Secret name containing STACKIT credentials.
    - name: stackitAdditionalLabels
      required: false
      schema:
        openAPIV3Schema:
          type: object
          description: Additional labels applied to STACKIT cloud resources.
          additionalProperties:
            type: string
    - name: kubeadmPreKubeadmCommands
      required: false
      schema:
        openAPIV3Schema:
          type: array
          description: Development fallback commands run before kubeadm to install node runtime packages.
          items:
            type: string
  patches:
    - name: stackitProjectID
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: StackitClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: replace
              path: /spec/template/spec/projectID
              valueFrom:
                variable: stackitProjectID
    - name: stackitRegion
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: StackitClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: replace
              path: /spec/template/spec/region
              valueFrom:
                variable: stackitRegion
    - name: stackitNetworkID
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: StackitClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: replace
              path: /spec/template/spec/network/id
              valueFrom:
                variable: stackitNetworkID
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: StackitMachineTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: replace
              path: /spec/template/spec/network/id
              valueFrom:
                variable: stackitNetworkID
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: StackitMachineTemplate
            matchResources:
              machineDeploymentClass:
                names:
                  - default-worker
          jsonPatches:
            - op: replace
              path: /spec/template/spec/network/id
              valueFrom:
                variable: stackitNetworkID
    - name: stackitImageID
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: StackitMachineTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: replace
              path: /spec/template/spec/imageID
              valueFrom:
                variable: stackitImageID
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: StackitMachineTemplate
            matchResources:
              machineDeploymentClass:
                names:
                  - default-worker
          jsonPatches:
            - op: replace
              path: /spec/template/spec/imageID
              valueFrom:
                variable: stackitImageID
    - name: stackitMachineType
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: StackitMachineTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: replace
              path: /spec/template/spec/machineType
              valueFrom:
                variable: stackitMachineType
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: StackitMachineTemplate
            matchResources:
              machineDeploymentClass:
                names:
                  - default-worker
          jsonPatches:
            - op: replace
              path: /spec/template/spec/machineType
              valueFrom:
                variable: stackitMachineType
    - name: stackitCredentialsSecretName
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: StackitClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: replace
              path: /spec/template/spec/credentialsSecretRef/name
              valueFrom:
                variable: stackitCredentialsSecretName
    - name: stackitAdditionalLabels
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: StackitClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: replace
              path: /spec/template/spec/additionalLabels
              valueFrom:
                variable: stackitAdditionalLabels
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: StackitMachineTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: replace
              path: /spec/template/spec/additionalLabels
              valueFrom:
                variable: stackitAdditionalLabels
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: StackitMachineTemplate
            matchResources:
              machineDeploymentClass:
                names:
                  - default-worker
          jsonPatches:
            - op: replace
              path: /spec/template/spec/additionalLabels
              valueFrom:
                variable: stackitAdditionalLabels
    - name: kubeadmPreKubeadmCommands
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: replace
              path: /spec/template/spec/kubeadmConfigSpec/preKubeadmCommands
              valueFrom:
                variable: kubeadmPreKubeadmCommands
        - selector:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            matchResources:
              machineDeploymentClass:
                names:
                  - default-worker
          jsonPatches:
            - op: replace
              path: /spec/template/spec/preKubeadmCommands
              valueFrom:
                variable: kubeadmPreKubeadmCommands
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: StackitClusterTemplate
metadata:
  name: stackit-cluster
spec:
  template:
    metadata:
      labels:
        cluster-api-provider-stackit/template-metadata: cluster
      annotations:
        cluster-api-provider-stackit/template-metadata: cluster
    spec:
      projectID: 00000000-0000-0000-0000-000000000000
      region: eu01
      additionalLabels: {}
      credentialsSecretRef:
        name: stackit-credentials
      network:
        id: 00000000-0000-0000-0000-000000000000
      apiServerLoadBalancer:
        enabled: true
      bastion:
        enabled: false
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlaneTemplate
metadata:
  name: stackit-control-plane
spec:
  template:
    spec:
      kubeadmConfigSpec:
        preKubeadmCommands:
          - "true"
        initConfiguration:
          nodeRegistration:
            name: "{{ ds.meta_data.local_hostname }}"
            criSocket: unix:///var/run/containerd/containerd.sock
            kubeletExtraArgs:
              - name: cloud-provider
                value: external
        joinConfiguration:
          nodeRegistration:
            name: "{{ ds.meta_data.local_hostname }}"
            criSocket: unix:///var/run/containerd/containerd.sock
            kubeletExtraArgs:
              - name: cloud-provider
                value: external
        clusterConfiguration:
          controllerManager:
            extraArgs:
              - name: cloud-provider
                value: external
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: StackitMachineTemplate
metadata:
  name: stackit-control-plane
spec:
  template:
    metadata:
      labels:
        cluster-api-provider-stackit/template-metadata: control-plane
      annotations:
        cluster-api-provider-stackit/template-metadata: control-plane
    spec:
      additionalLabels: {}
      imageID: 00000000-0000-0000-0000-000000000000
      machineType: c2i.2
      rootVolume:
        sizeGiB: 50
        performanceClass: storage_premium_perf6
        deleteOnTermination: true
      network:
        id: 00000000-0000-0000-0000-000000000000
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: StackitMachineTemplate
metadata:
  name: stackit-default-worker
spec:
  template:
    metadata:
      labels:
        cluster-api-provider-stackit/template-metadata: worker
      annotations:
        cluster-api-provider-stackit/template-metadata: worker
    spec:
      additionalLabels: {}
      imageID: 00000000-0000-0000-0000-000000000000
      machineType: c2i.2
      rootVolume:
        sizeGiB: 50
        performanceClass: storage_premium_perf6
        deleteOnTermination: true
      network:
        id: 00000000-0000-0000-0000-000000000000
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: stackit-default-worker
spec:
  template:
    spec:
      preKubeadmCommands:
        - "true"
      joinConfiguration:
        nodeRegistration:
          name: "{{ ds.meta_data.local_hostname }}"
          criSocket: unix:///var/run/containerd/containerd.sock
          kubeletExtraArgs:
            - name: cloud-provider
              value: external
